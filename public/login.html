<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iniciar sesión — Sistema de Facturas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet" />
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: 'Manrope', sans-serif;
        background: #070c1a;
        color: #eef4ff;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .card {
        background: #0f1830;
        border: 1px solid rgba(79, 215, 255, 0.15);
        border-radius: 16px;
        padding: 48px 40px;
        width: 100%;
        max-width: 400px;
        text-align: center;
        box-shadow: 0 24px 64px rgba(0,0,0,0.5);
      }
      .brand {
        font-family: 'Space Grotesk', sans-serif;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        color: #4fd7ff;
        margin-bottom: 36px;
        display: block;
      }
      h1 {
        font-family: 'Space Grotesk', sans-serif;
        font-size: 26px;
        font-weight: 700;
        color: #eef4ff;
        margin-bottom: 10px;
      }
      .subtitle {
        color: #7a9ec0;
        font-size: 14px;
        line-height: 1.6;
        margin-bottom: 32px;
      }
      .field { text-align: left; margin-bottom: 16px; }
      .field label {
        display: block;
        font-size: 12px;
        font-weight: 600;
        color: #8ab4d4;
        margin-bottom: 7px;
      }
      .field input {
        width: 100%;
        padding: 12px 14px;
        background: #070c1a;
        border: 1px solid rgba(79, 215, 255, 0.2);
        border-radius: 8px;
        color: #eef4ff;
        font-family: 'Manrope', sans-serif;
        font-size: 14px;
        transition: border-color 0.15s;
      }
      .field input:focus {
        outline: none;
        border-color: #4fd7ff;
      }
      .field input:disabled { opacity: 0.5; }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        width: 100%;
        padding: 14px 24px;
        margin-top: 8px;
        background: #1f6fff;
        color: #fff;
        border: none;
        border-radius: 8px;
        font-family: 'Manrope', sans-serif;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.15s, opacity 0.15s;
      }
      .btn:hover:not(:disabled) { background: #1a5fdd; }
      .btn:disabled { opacity: 0.45; cursor: not-allowed; }
      .status {
        margin-top: 18px;
        font-size: 13px;
        color: #7a9ec0;
        min-height: 18px;
      }
      .status.error { color: #ff6b6b; }
    </style>
  </head>
  <body>
    <div class="card">
      <span class="brand">Sistema Automatizado de Facturas</span>
      <h1>Bienvenido</h1>
      <p class="subtitle">Inicia sesión para acceder al panel de procesamiento documental.</p>

      <form id="loginForm">
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" autocomplete="username" required disabled />
        </div>
        <div class="field">
          <label for="password">Contraseña</label>
          <input type="password" id="password" autocomplete="current-password" required disabled />
        </div>
        <button class="btn" id="loginBtn" type="submit" disabled>Iniciar sesión</button>
      </form>

      <p class="status" id="status">Cargando configuración...</p>
    </div>

    <script>
      var statusEl = document.getElementById('status');
      var loginBtn = document.getElementById('loginBtn');
      var emailEl = document.getElementById('email');
      var passwordEl = document.getElementById('password');
      var formEl = document.getElementById('loginForm');

      function setError(msg) {
        statusEl.className = 'status error';
        statusEl.textContent = msg;
      }

      function setEnabled(enabled) {
        loginBtn.disabled = !enabled;
        emailEl.disabled = !enabled;
        passwordEl.disabled = !enabled;
      }

      // Firebase devuelve codigos genericos a proposito (no revela si el email
      // existe); se traducen a un mensaje util sin filtrar esa informacion.
      function messageFor(err) {
        switch (err && err.code) {
          case 'auth/invalid-credential':
          case 'auth/wrong-password':
          case 'auth/user-not-found':
            return 'Email o contraseña incorrectos.';
          case 'auth/invalid-email':
            return 'El email no tiene un formato válido.';
          case 'auth/user-disabled':
            return 'Este usuario está deshabilitado.';
          case 'auth/too-many-requests':
            return 'Demasiados intentos fallidos. Esperá unos minutos.';
          case 'auth/network-request-failed':
            return 'Sin conexión con el servidor de autenticación.';
          default:
            return 'No se pudo iniciar sesión: ' + ((err && err.message) || 'intentá de nuevo.');
        }
      }

      fetch('/api/auth/config')
        .then(function (r) { return r.json(); })
        .then(function (cfg) {
          if (!cfg.enabled) {
            window.location.replace('/');
            return;
          }

          firebase.initializeApp({
            apiKey: cfg.apiKey,
            authDomain: cfg.authDomain,
            projectId: cfg.projectId,
          });
          var auth = firebase.auth();

          // Si ya hay sesion persistida, no tiene sentido mostrar el form.
          var unsubscribe = auth.onAuthStateChanged(function (user) {
            unsubscribe();
            if (user) {
              window.location.replace('/');
              return;
            }
            statusEl.textContent = '';
            setEnabled(true);
            emailEl.focus();
          });

          formEl.addEventListener('submit', function (event) {
            event.preventDefault();
            setEnabled(false);
            statusEl.className = 'status';
            statusEl.textContent = 'Verificando...';

            auth
              .signInWithEmailAndPassword(emailEl.value.trim(), passwordEl.value)
              .then(function () {
                window.location.replace('/');
              })
              .catch(function (err) {
                setError(messageFor(err));
                setEnabled(true);
                passwordEl.value = '';
                passwordEl.focus();
              });
          });
        })
        .catch(function () {
          setError('No se pudo conectar con el servidor.');
        });
    </script>
  </body>
</html>
